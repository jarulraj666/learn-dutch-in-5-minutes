version: '3.8'

services:
  dutch-video-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: dutch-video-generator:kokoro-latest
    container_name: dutch-video-gen
    
    environment:
      # TTS Configuration
      TTS_PROVIDER: kokoro
      LANGUAGE: nl
      
      # Database
      DB_PATH: db/content.db
      
      # Output directories
      OUTPUT_DIR: output
      VIDEO_OUTPUT_DIR: output/videos
      
      # Ollama Configuration (if running locally)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      OLLAMA_IMAGE_MODEL: x/flux2-klein:4b
      
      # Timezone
      CHANNEL_TIMEZONE: Europe/Amsterdam
      
      # API Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    
    volumes:
      # Persist generated content and database
      - ./output:/app/output
      - ./db:/app/db
      - ./.env:/app/.env:ro
      # Cache Kokoro ONNX models to avoid re-downloading on restart
      - kokoro_model_cache:/root/.cache/kokoro
      - huggingface_cache:/root/.cache/huggingface
    
    # CPU and memory limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
        reservations:
          cpus: '1'
          memory: 2G
    
    # Keep container running
    stdin_open: true
    tty: true

volumes:
  kokoro_model_cache:
  huggingface_cache:
