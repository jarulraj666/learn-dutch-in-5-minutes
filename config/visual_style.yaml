render:
  width: 1920
  height: 1080
  fps: 30
  crf: 19
  preset: slow
  speed_application: final_output  # Speed is applied as a final FFmpeg pass after rendering
  # Fade duration for multi-image transitions (dialogue only)
  fade_duration: 1.5  # seconds (crossfade between images)
  # Static seed images used as character reference for multi-scene dialogue images.
  # One is chosen at random per episode to maintain consistent character appearance
  # across all scenes while allowing variation between episodes.
  dialogue_seed_images:
    - assets/static_images/seed_image_1.png
    - assets/static_images/seed_image_2.jpeg
    - assets/static_images/seed_image_3.jpeg
    - assets/static_images/seed_image_4.jpeg
    - assets/static_images/seed_image_5.jpeg
  # Playback speed per category (<1.0 = slower, >1.0 = faster)
  playback_speed:
    dialogue: 0.90
    grammar: 1.0
    vocabulary: 1.0
    common_words: 1.0
    default: 1.0
  # Multi-speaker subtitle positioning (dialogue only)
  subtitle_margins:
    left_speaker_margin_l: 500      # Speaker1 (left) - left margin
    left_speaker_margin_r: 600     # Speaker1 (left) - right margin
    right_speaker_margin_l: 600    # Speaker2 (right) - left margin
    right_speaker_margin_r: 320     # Speaker2 (right) - right margin
    margin_v: 350                  # Vertical margin (bottom)
  # Multi-speaker alignment (ASS alignment codes)
  dialogue_alignment:
    left_speaker: 1                # Speaker1 (left) - alignment 1 = bottom-left
    right_speaker: 3               # Speaker2 (right) - alignment 3 = bottom-right
  # Single-speaker subtitle positioning (grammar, vocabulary, etc.)
  single_speaker_margins:
    margin_l: 700                  # Left margin
    margin_r: 100                  # Right margin
    margin_v: 350                  # Vertical margin (bottom)
    alignment: 2                 # ASS alignment (8 = top-center, 2 = bottom-center)
  # Burn English translation subtitles into the long video.
  # false = English only available as a soft track in the webapp player.
  # true  = English text is permanently baked into the video frames.
  burn_english_subtitles: false
